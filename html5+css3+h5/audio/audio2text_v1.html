<!DOCTYPE html>
<html>

<head>
  <title>语音转文字 Demo</title>
  <style>
    .wave-container {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      gap: 2.5px;
      background-color: #c9d3ff;
    } 
    .wave-bar {
      width: 2px;
      height: 4px;
      border-radius: 2px;
      background: #3038ff;
      transition: height 0.2s;
    }

    .hidden {
      display: none;
    }

    button {
      padding: 10px;
      margin: 5px;
      cursor: pointer;
    }

  </style>
</head>

<body>
  <div class="wave-container">
    <div class="wave-bar"></div>
    <div class="wave-bar"></div>
    <div class="wave-bar"></div>
    <div class="wave-bar"></div>
  </div>

  <button id="start">开始录音</button>
  <button id="pause">暂停录音</button>
  <button id="stop">停止录音</button>
  结果：
  <div id="output" style="margin-top: 20px;">
  </div>

  <script>
    const startBtn = document.getElementById('start');
    const pauseBtn = document.getElementById('pause');
    const stopBtn = document.getElementById('stop');
    const outputDiv = document.getElementById('output');
    const waveBars = document.querySelectorAll('.wave-bar');

    let audioContext;
    let analyser;
    let mediaRecorder;
    let audioChunks = [];
    let recognition;
    let isSpeaking = false;
    let animationFrameId;

    // 初始化音频分析
    async function initAudio(stream) {
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioContext.createAnalyser();
      const source = audioContext.createMediaStreamSource(stream);
      source.connect(analyser);
      analyser.fftSize = 32;
    }

    // 更新波形显示
    function updateWave() {
      if (!analyser) return;
      const bufferLength = analyser.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);
      analyser.getByteFrequencyData(dataArray);

      const average = dataArray.reduce((a, b) => a + b) / bufferLength;
      console.log(dataArray, average, 'average');
      isSpeaking = average > 10; // 音量阈值

      waveBars.forEach((bar, index) => {
        const height = isSpeaking
          ? 2 + (dataArray[index] / 255 * 9)
          : 2;
        if(index === 0 || index === 3) {
          bar.style.height = `${height - 2}px`;
        } else {
          bar.style.height = `${height}px`;
        }
      });

      animationFrameId = requestAnimationFrame(updateWave);
    }

    // 初始化语音识别
    function initRecognition() {
      recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = 'zh-CN';

      let finalTranscript = '';

      recognition.onresult = (event) => {
        let interimTranscript = '';

        for (let i = event.resultIndex; i < event.results.length; i++) {
          const transcript = event.results[i][0].transcript;
          if (event.results[i].isFinal) {
            finalTranscript += transcript + ' ';
          } else {
            interimTranscript += transcript;
          }
        }

        outputDiv.innerHTML = finalTranscript +
          `<i style="color:gray">${interimTranscript}</i>`;
      };

      recognition.onend = () => {
        outputDiv.innerHTML = finalTranscript;
      };
    }
    // 音频流
    let stream = null;
    // 开始录音
    startBtn.addEventListener('click', async () => {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);

        await initAudio(stream);
        initRecognition();

        mediaRecorder.start();
        recognition.start();
        updateWave();

        startBtn.disabled = true;
        pauseBtn.disabled = false;
        stopBtn.disabled = false;
      } catch (err) {
        console.error('无法访问麦克风:', err);
      }
    });

    // 暂停录音
    pauseBtn.addEventListener('click', () => {
      if (mediaRecorder.state === 'recording') {
        mediaRecorder.pause();
        recognition.stop();
        cancelAnimationFrame(animationFrameId);
        pauseBtn.textContent = '继续录音';
      } else {
        mediaRecorder.resume();
        recognition.start();
        updateWave();
        pauseBtn.textContent = '暂停录音';
      }
    });

    // 停止录音
    stopBtn.addEventListener('click', () => {
      mediaRecorder.stop();
      recognition.stop();
      cancelAnimationFrame(animationFrameId);
      // 停止音频流
      stream?.getTracks().forEach(track => track.stop());

      startBtn.disabled = false;
      pauseBtn.disabled = true;
      stopBtn.disabled = true;
      pauseBtn.textContent = '暂停录音';

      waveBars.forEach(bar => bar.style.height = '4px');
    });

    // 设置初始按钮状态
    pauseBtn.disabled = true;
    stopBtn.disabled = true;
  </script>
</body>

</html>
